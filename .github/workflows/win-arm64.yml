name: Build Windows ARM64
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-11-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Download SDL2 source
      shell: bash
      run: |
        git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL2_src

    - name: Build SDL2 for ARM64
      shell: cmd
      run: |
        cmake -S SDL2_src -B SDL2_build -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_INSTALL_PREFIX=SDL2_arm64 -DSDL_SHARED=ON -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
        cmake --build SDL2_build --config Release
        cmake --install SDL2_build --config Release

    - name: Fix SDL2 lib path
      shell: bash
      run: |
        # CMake multi-config install may put libs in lib/Release/ instead of lib/
        if [ -d "SDL2_arm64/lib/Release" ]; then
          cp -v SDL2_arm64/lib/Release/* SDL2_arm64/lib/
        fi
        echo "=== SDL2 lib contents ==="
        ls -la SDL2_arm64/lib/*.lib 2>/dev/null || echo "No .lib files in lib/"
        ls -la SDL2_arm64/lib/Release/*.lib 2>/dev/null || echo "No .lib files in lib/Release/"

    - name: Configure engine
      shell: bash
      run: |
        ./waf.bat configure -s "SDL2_arm64" -T release --enable-bundled-deps --enable-utils --enable-all-renderers -8 --skip-sdl2-sanity-check

    - name: Build engine
      shell: bash
      run: |
        ./waf.bat build

    - name: Install engine
      shell: bash
      run: |
        ./waf.bat install --destdir=.

    - name: Package
      shell: bash
      run: |
        cp SDL2_arm64/bin/SDL2.dll .
        mkdir -p artifacts
        7z a -t7z "artifacts/xash3d-fwgs-win32-arm64.7z" -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on \
          ./*.dll ./*.exe activities.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xash3d-fwgs-windows-arm64
        path: artifacts/*
